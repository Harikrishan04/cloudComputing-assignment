name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      model_release_tag:
        description: "GitHub Release tag to evaluate (for example v1)"
        required: false
        default: "v1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check service worker training tests tools/kaggle_label.py
        working-directory: repo

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r service/requirements.txt pytest
        working-directory: repo
      - run: pytest tests -v
        working-directory: repo

  evaluate:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r service/requirements.txt
        working-directory: repo
      - name: Install model-compatible evaluation dependencies
        run: pip install --upgrade transformers==5.22.2 tokenizers==0.23.3
        working-directory: repo
      - name: Download model from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.model_release_tag }}
        run: |
          mkdir -p eval_model
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern models-v1.tar.gz \
            --dir .
          tar -xzf models-v1.tar.gz -C eval_model --strip-components=1
        working-directory: repo
      - name: Run evaluation and produce predictions
        run: python tests/run_eval.py --model-dir ./eval_model --validation data/validation.jsonl --out predictions.jsonl
        working-directory: repo
      - name: Score
        run: python tools/score.py predictions.jsonl data/validation.jsonl --out results/ci_score.json
        working-directory: repo
      - name: Save evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: |
            repo/predictions.jsonl
            repo/results/ci_score.json

  quality-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r service/requirements.txt
        working-directory: repo
      - name: Restore evaluation artifacts
        uses: actions/download-artifact@v4
        with:
          name: evaluation
          path: repo
      - name: Enforce minimum JSON validity
        run: python tools/score.py predictions.jsonl data/validation.jsonl --min-validity 95
        working-directory: repo

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
