apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 0
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.73
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.port=8333"
            - "-master.volumeSizeLimitMB=1024"
          ports:
            - containerPort: 9333
            - containerPort: 8080
            - containerPort: 8888
            - containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: data
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
apiVersion: v1
kind: Endpoints
metadata:
  name: seaweedfs-s3
  namespace: data
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: s3
        port: 8333
        protocol: TCP
